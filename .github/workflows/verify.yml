name: Verify contracts and prototypes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0' # Reproduce local prototype tests; production runtime is pinned in B00.
          package-manager-cache: false
      - name: Install isolated contract-check tools
        run: |
          python3 -m venv .artifacts/verify
          .artifacts/verify/bin/python -m pip install -r requirements.txt
          npm install --prefix .artifacts/tools --no-save --ignore-scripts --no-package-lock typescript@5.8.3
      - name: Check current repository contracts and references
        run: |
          export PATH="$PWD/.artifacts/tools/node_modules/.bin:$PATH"
          .artifacts/verify/bin/python scripts/validate_repo.py --require-tsc
      - name: Test the in-memory prototype
        run: node --test prototypes/runtime/model.test.mjs
